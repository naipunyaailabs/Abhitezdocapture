{% extends "base.html" %}

{% block title %}Set Your Password - DoCapture AI{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <img src="/static/assets/docapture-logo.png" alt="DoCapture" style="height: 48px; width: auto;">
            </div>
            <h2>Set your password</h2>
            <p class="auth-subtitle">Create a password to activate your account.</p>

            <div id="sp-error" class="auth-error" style="display: none;"></div>
            <div id="sp-success" class="auth-success" style="display: none;"></div>

            <form id="sp-form" onsubmit="handleSetPassword(event)">
                <div class="form-group">
                    <label>New Password *</label>
                    <input type="password" id="sp-password" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="sp-confirm" placeholder="Re-enter password" required minlength="8">
                </div>
                <button type="submit" id="sp-btn" class="btn-premium btn-primary"
                    style="width: 100%; margin-top: 1rem;">Activate Account</button>
            </form>
        </div>
    </div>
</section>

<script>
    const SP_TOKEN = "{{ token }}";

    async function handleSetPassword(event) {
        event.preventDefault();
        const err = document.getElementById('sp-error');
        const ok = document.getElementById('sp-success');
        const btn = document.getElementById('sp-btn');
        err.style.display = 'none'; ok.style.display = 'none';

        const pw = document.getElementById('sp-password').value;
        const confirm = document.getElementById('sp-confirm').value;

        if (!SP_TOKEN) {
            err.textContent = 'Missing activation token. Please use the link from your email.';
            err.style.display = 'block'; return;
        }
        if (pw !== confirm) {
            err.textContent = 'Passwords do not match.';
            err.style.display = 'block'; return;
        }

        btn.textContent = 'Activating...'; btn.disabled = true;
        try {
            const res = await fetch('/auth/set-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: SP_TOKEN, newPassword: pw })
            });
            const data = await res.json();
            if (res.ok) {
                ok.textContent = 'Password set! Redirecting you to sign in...';
                ok.style.display = 'block';
                document.getElementById('sp-form').style.display = 'none';
                setTimeout(() => { window.location.href = '/?login=true'; }, 1800);
            } else {
                err.textContent = data.detail || 'Failed to set password.';
                err.style.display = 'block';
            }
        } catch (e) {
            err.textContent = 'Network error. Please try again.';
            err.style.display = 'block';
        } finally {
            btn.textContent = 'Activate Account'; btn.disabled = false;
        }
    }
</script>

<style>
    .auth-page { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 4rem 2rem; }
    .auth-container { width: 100%; max-width: 460px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 24px; padding: 3rem; box-shadow: var(--card-shadow); }
    .auth-card h2 { font-size: 1.75rem; font-weight: 800; text-align: center; color: var(--text-main); margin-bottom: 0.5rem; }
    .auth-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; }
    .auth-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; }
    .auth-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; }
    .auth-card .form-group { margin-bottom: 1rem; }
    .auth-card label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); }
    .auth-card input[type="password"] { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; }
    .auth-card input:focus { outline: none; border-color: var(--primary); }
</style>
{% endblock %}
