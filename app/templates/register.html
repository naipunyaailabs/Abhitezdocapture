{% extends "base.html" %}

{% block title %}Create Account - Docapture AI{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <img id="register-logo" src="/static/assets/docapture-logo.png" alt="Docapture" style="height: 48px; width: auto;">
            </div>
            <h2>Create your account</h2>
            <p class="auth-subtitle">Start your free trial — 5 documents, no credit card required.</p>

            <div id="register-error" class="auth-error" style="display: none;"></div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="r-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Work Email *</label>
                        <input type="email" id="r-email" placeholder="john@company.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="r-password" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="r-company" placeholder="Optional">
                    </div>
                    <div class="form-group">
                        <label>Designation</label>
                        <input type="text" id="r-designation" placeholder="Optional">
                    </div>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-start; gap: 0.75rem;">
                    <input type="checkbox" id="r-terms" required style="width: auto; margin-top: 3px;">
                    <label for="r-terms" style="font-weight: 400; font-size: 0.85rem; color: var(--text-muted);">
                        I agree to the <a href="#" style="color: var(--primary);">Terms of Service</a> and <a href="#"
                            style="color: var(--primary);">Privacy Policy</a>.
                    </label>
                </div>
                <button type="submit" id="register-btn" class="btn-premium btn-primary"
                    style="width: 100%; margin-top: 1rem;">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="#" onclick="openLogin()">Sign In</a>
            </p>
        </div>
    </div>
</section>

<script>
    async function handleRegister(event) {
        event.preventDefault();
        const btn = document.getElementById('register-btn');
        const errBox = document.getElementById('register-error');
        errBox.style.display = 'none';

        btn.textContent = 'Creating account...';
        btn.disabled = true;

        try {
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('r-name').value,
                    email: document.getElementById('r-email').value,
                    password: document.getElementById('r-password').value,
                    companyName: document.getElementById('r-company').value || null,
                    designation: document.getElementById('r-designation').value || null,
                    agreedToTerms: document.getElementById('r-terms').checked
                })
            });

            const data = await res.json();

            if (res.ok && data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/verify-email-sent?email=' + encodeURIComponent(document.getElementById('r-email').value);
            } else {
                errBox.textContent = data.detail || 'Registration failed';
                errBox.style.display = 'block';
            }
        } catch (e) {
            errBox.textContent = 'Network error. Please try again.';
            errBox.style.display = 'block';
        } finally {
            btn.textContent = 'Create Account';
            btn.disabled = false;
        }
    }
</script>

<style>
    .auth-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
    }

    .auth-container {
        width: 100%;
        max-width: 580px;
    }

    .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 3rem;
        box-shadow: var(--card-shadow);
    }

    .auth-card h2 {
        font-size: 1.75rem;
        font-weight: 800;
        text-align: center;
        color: var(--text-main);
        margin-bottom: 0.5rem;
    }

    .auth-subtitle {
        text-align: center;
        color: var(--text-muted);
        margin-bottom: 2rem;
    }

    .auth-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .auth-card .form-group {
        margin-bottom: 1rem;
    }

    .auth-card label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }

    .auth-card input[type="text"],
    .auth-card input[type="email"],
    .auth-card input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.9rem;
    }

    .auth-card input:focus {
        outline: none;
        border-color: var(--primary);
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    @media (max-width: 640px) {
        .form-row {
            grid-template-columns: 1fr;
        }

        .auth-card {
            padding: 2rem;
        }
    }
</style>
{% endblock %}
